name: ci
on:
  push: { branches: [main, develop] }
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-superuser }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache: false }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -e ".[dev]" pip-audit
      - run: ruff check . && ruff format --check .
      - run: mypy aegis
      - run: python -m aegis.cli export-schema --check
        env: { AEGIS_DATABASE_URL: "postgresql+psycopg://x:x@localhost/x", AEGIS_JWT_SECRET: "ci-only-not-a-secret-0123456789abcdef" }
      - run: python -m pytest -p no:warnings
        env:
          AEGIS_TEST_ADMIN_URL: postgresql+psycopg://postgres:ci-only-superuser@127.0.0.1:5432/postgres
      - run: pip-audit --skip-editable

  agent:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, windows-2022] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache: false }
      - run: go version
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -trimpath -o aegis-agent-bin ./cmd/aegis-agent
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  dashboard:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic && python scripts/secret_scan.py
      # gitleaks CLI (MIT) via its official container; the GitHub Action needs a paid
      # license for organization repositories.
      - run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          git /repo --redact --verbose --exit-code 1

  agent-binaries:
    # Release binaries are built here, with the latest patched Go toolchain, never by hand.
    needs: [agent]
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "stable", cache: false }
      - name: Build
        env: { CGO_ENABLED: "0" }
        run: |
          go version | tee BUILD-INFO.txt
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/aegis-agent-linux-amd64 ./cmd/aegis-agent
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/aegis-agent-windows-amd64.exe ./cmd/aegis-agent
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -mode=binary dist/aegis-agent-linux-amd64 | tee -a BUILD-INFO.txt
          cd dist && sha256sum * | tee SHA256SUMS && cp ../BUILD-INFO.txt .
      - uses: actions/upload-artifact@v4
        with: { name: aegis-agent-binaries, path: agent/dist/, retention-days: 30 }
