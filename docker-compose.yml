# AEGIS local-demo stack. All ports bind to 127.0.0.1 only.
# Start:  cp .env.example .env  (edit values)  &&  docker compose up --build
# Seed development users (once):  docker compose run --rm api python -m aegis.cli seed-dev
name: aegis

x-backend-env: &backend-env
  AEGIS_PROFILE: ${AEGIS_PROFILE:-local-demo}
  AEGIS_DATABASE_URL: postgresql+psycopg://aegis_app:${AEGIS_DB_APP_PASSWORD:?set in .env}@postgres:5432/aegis
  AEGIS_MIGRATION_DATABASE_URL: postgresql+psycopg://aegis_owner:${AEGIS_DB_OWNER_PASSWORD:?set in .env}@postgres:5432/aegis
  AEGIS_JWT_SECRET: ${AEGIS_JWT_SECRET:?set in .env}
  AEGIS_DEV_PASSWORD: ${AEGIS_DEV_PASSWORD:-}
  AEGIS_CORS_ORIGINS: '["http://127.0.0.1:8080"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${AEGIS_DB_SUPERUSER_PASSWORD:?set in .env}
      AEGIS_DB_OWNER_PASSWORD: ${AEGIS_DB_OWNER_PASSWORD}
      AEGIS_DB_APP_PASSWORD: ${AEGIS_DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/bootstrap.sql:/aegis/bootstrap.sql:ro
      - ./infrastructure/database/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    environment: *backend-env
    command: ["python", "-m", "aegis.cli", "migrate"]
    healthcheck: { disable: true }
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    environment: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile }
    environment: *backend-env
    command: ["python", "-m", "aegis.cli", "worker"]
    healthcheck: { disable: true }
    depends_on: { migrate: { condition: service_completed_successfully } }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  dashboard:
    build: { context: ., dockerfile: infrastructure/docker/dashboard.Dockerfile }
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
